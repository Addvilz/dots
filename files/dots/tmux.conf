# ~/.tmux.conf -- Fedora and SSH
# Baseline: tmux 3.2+. Auto-hiding scrollbars need tmux 3.8+.
# Install this file on each host where you run tmux.
#
# Theme adapted from Nord tmux (MIT):
# Copyright (C) 2017-present Arctic Ice Studio <development@arcticicestudio.com>
# Copyright (C) 2017-present Sven Greb <development@svengreb.de>
# https://github.com/nordtheme/tmux

# --- Prefix ----------------------------------------------------------
set -g prefix C-w
unbind C-b
bind C-w send-prefix

# --- Everyday behavior -----------------------------------------------
set -g mouse on
setw -g mode-keys vi
set -g status-keys vi

# Keep manually assigned window names.
setw -g allow-rename off
setw -g automatic-rename off

# Retain more scrollback per pane.
set -g history-limit 50000

# New windows and panes start in the active pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# Toggle synchronized input for this window; the status bar also shows SYNC.
bind b setw synchronize-panes \; display-message 'Pane sync: #{?pane_synchronized,ON,OFF}'

# Reload this configuration: Ctrl+w, then r.
bind r source-file ~/.tmux.conf

# Temporary popup shell: Ctrl+w, then uppercase P. Type exit to close it.
bind P display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Keep activity indicators without activity messages or bells.
setw -g monitor-activity on
set -g activity-action none

# --- Terminal capabilities -------------------------------------------
# Prefer tmux's own terminfo entry when installed on this host.
# Keep automatic detection of the outer terminal's RGB/key capabilities.
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' {
    set -g default-terminal tmux-256color
} {
    set -g default-terminal screen-256color
}

# --- Clipboard over SSH ----------------------------------------------
# OSC 52 sends copied text through SSH to the local terminal's clipboard.
# "on" also accepts OSC 52 from applications and nested tmux instances.
# The terminal on your desktop must support and allow OSC 52.
set -s set-clipboard on
set -s copy-command ''

# --- Copy mode -------------------------------------------------------
# Ctrl+w [ enters copy mode; v selects; y copies; Ctrl+w ] pastes.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# Reserve Ctrl+v for terminal paste; also clear the old binding on reload.
unbind -T copy-mode-vi C-v
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# Drag to select; releasing the mouse copies and exits copy mode.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# --- Auto-hiding scrollbars ------------------------------------------
# Probe this server for the option introduced with auto-hide in tmux 3.8.
if-shell 'tmux -S #{q:socket_path} show-options -gw pane-scrollbars-timeout >/dev/null 2>&1' {
    set -gw pane-scrollbars auto-hide
    set -gw pane-scrollbars-position right
    set -gw pane-scrollbars-style 'fg=#88C0D0,bg=#3B4252'
}

# --- Nord colors: modern style options -------------------------------
set -g status-style 'none,fg=#D8DEE9,bg=#2E3440'
set -g pane-border-style 'fg=#4C566A,bg=#2E3440'
set -g pane-active-border-style 'fg=#88C0D0,bg=#2E3440'
set -g mode-style 'fg=#2E3440,bg=#88C0D0,bold'
set -g message-style 'fg=#88C0D0,bg=#3B4252'
set -g message-command-style 'fg=#88C0D0,bg=#3B4252'
set -g display-panes-colour '#81A1C1'
set -g display-panes-active-colour '#88C0D0'
setw -g clock-mode-colour '#88C0D0'

# --- Status bar ------------------------------------------------------
set -g status on
set -g status-justify left
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100
set -g window-status-separator ''

# Session name.
set -g status-left '#[fg=#2E3440,bg=#81A1C1,bold] #S #[fg=#81A1C1,bg=#2E3440,nobold]'

# Native indicators
set -g status-right '#{?client_prefix,#[fg=#2E3440]#[bg=#88C0D0]#[bold] PREFIX #[default] ,}'
set -ag status-right '#{?pane_synchronized,#[fg=#ECEFF4]#[bg=#BF616A]#[bold] SYNC #[default] ,}'
set -ag status-right '#[fg=#4C566A,bg=#2E3440]#[fg=#D8DEE9,bg=#4C566A] %Y-%m-%d  %H:%M '
set -ag status-right '#[fg=#88C0D0,bg=#4C566A]#[fg=#2E3440,bg=#88C0D0,bold] #H '

# Window tabs. #F includes activity and zoom flags.
set -g window-status-format '#[fg=#2E3440,bg=#4C566A,nobold,noitalics,nounderscore]#[fg=#D8DEE9,bg=#4C566A] #I  #W #F #[fg=#4C566A,bg=#2E3440]'
set -g window-status-current-format '#[fg=#2E3440,bg=#88C0D0,nobold,noitalics,nounderscore]#[fg=#2E3440,bg=#88C0D0,bold] #I  #W #F #[fg=#88C0D0,bg=#2E3440,nobold]'
